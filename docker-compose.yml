services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: runtime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runtime-local-only}
      POSTGRES_DB: runtime
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtime"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://runtime:${POSTGRES_PASSWORD:-runtime-local-only}@postgres:5432/runtime
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://runtime:${POSTGRES_PASSWORD:-runtime-local-only}@postgres:5432/runtime
      MODEL_PROVIDER: mock
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
