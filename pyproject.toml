[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isolated-agent-runtime"
version = "0.1.0"
description = "A policy-driven, observable multi-agent runtime with isolated information flows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3", "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1", "httpx>=0.27,<1", "alembic>=1.14,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.scripts]
agent-runtime = "app.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "demos"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "demos"]
