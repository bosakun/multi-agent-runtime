<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550"><rect width="1100" height="100%" fill="#fff"/><g font-family="sans-serif" fill="#172b3a"><text x="30" y="38" font-size="24">1 · Experimental conditions</text><text x="30" y="70" font-size="16">Design diagram — not an empirical result</text><rect x="30" y="94" width="1040" height="58" rx="6" fill="#536878" opacity=".12"/><text x="45" y="120" font-size="17">C0 Single</text><text x="300" y="120" font-size="16">All 9 evidence → 1 neutral worker → Final answer</text><rect x="30" y="166" width="1040" height="58" rx="6" fill="#6879b0" opacity=".12"/><text x="45" y="192" font-size="17">C1 Homogeneous shared</text><text x="300" y="192" font-size="16">All 9 → 3 neutral workers → Artifacts → Synthesizer</text><rect x="30" y="238" width="1040" height="58" rx="6" fill="#437db0" opacity=".12"/><text x="45" y="264" font-size="17">C2 Role diverse shared</text><text x="300" y="264" font-size="16">All 9 → 3 different roles → Artifacts → Synthesizer</text><rect x="30" y="310" width="1040" height="58" rx="6" fill="#16887b" opacity=".12"/><text x="45" y="336" font-size="17">C3 Epistemic diverse</text><text x="300" y="336" font-size="16">3 disjoint partitions → 3 neutral workers → Artifacts → Synthesizer</text><rect x="30" y="382" width="1040" height="58" rx="6" fill="#a36b38" opacity=".12"/><text x="45" y="408" font-size="17">C4 Role + epistemic</text><text x="300" y="408" font-size="16">3 disjoint partitions → 3 shuffled roles → Artifacts → Synthesizer</text><text x="30" y="515" font-size="16">Same model &amp; parameters. C1–C4 share one synthesizer; no raw evidence reaches it.</text></g></svg>
