name: Quality and isolation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: runtime
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: runtime
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U runtime"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install uv
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://runtime:test-only@localhost:5432/runtime
      - run: uv run pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://runtime:test-only@localhost:5432/runtime
